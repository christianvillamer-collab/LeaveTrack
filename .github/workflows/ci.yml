name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  database:
    name: Migrations and idempotent seed
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leavetrack
          POSTGRES_PASSWORD: leavetrack
          POSTGRES_DB: leavetrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leavetrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://leavetrack:leavetrack@localhost:5432/leavetrack
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:seed
      - name: Assert schema and idempotent seed
        run: |
          test "$(psql "$DATABASE_URL" -tAc 'select count(*) from leave_types')" = "3"
          test "$(psql "$DATABASE_URL" -tAc 'select count(*) from users')" = "10"
          test "$(psql "$DATABASE_URL" -tAc 'select count(*) from leave_requests')" = "11"
          test "$(psql "$DATABASE_URL" -tAc 'select count(*) from audit_log')" = "8"
          test "$(psql "$DATABASE_URL" -tAc "select count(*) from leave_policies where leave_type_id = '33333333-3333-4333-8333-333333333333'")" = "0"
      - name: Submit-request integration test
        run: npm run test:db
