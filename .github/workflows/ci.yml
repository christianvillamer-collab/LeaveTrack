name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  database:
    name: Migrations and idempotent seed
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leavetrack
          POSTGRES_PASSWORD: leavetrack
          POSTGRES_DB: leavetrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leavetrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://leavetrack:leavetrack@localhost:5432/leavetrack
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:seed
      - name: Assert schema and idempotent seed
        run: |
          test "$(psql "$DATABASE_URL" -tAc 'select count(*) from leave_types')" = "3"
          test "$(psql "$DATABASE_URL" -tAc 'select count(*) from users')" = "10"
          test "$(psql "$DATABASE_URL" -tAc 'select count(*) from leave_requests')" = "11"
          test "$(psql "$DATABASE_URL" -tAc 'select count(*) from audit_log')" = "8"
          test "$(psql "$DATABASE_URL" -tAc "select count(*) from leave_policies where leave_type_id = '33333333-3333-4333-8333-333333333333'")" = "0"
          test "$(psql "$DATABASE_URL" -tAc "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relkind = 'r' and c.relname in ('users','leave_types','leave_policies','leave_balances','leave_requests','audit_log','accrual_ledger') and c.relrowsecurity")" = "7"
          test "$(psql "$DATABASE_URL" -tAc "select count(*) from pg_class c where c.relnamespace = 'public'::regnamespace and c.relkind = 'r' and c.relname in ('users','leave_types','leave_policies','leave_balances','leave_requests','audit_log','accrual_ledger') and (select count(*) from pg_policies p where p.schemaname = 'public' and p.tablename = c.relname) = 2")" = "7"
          test "$(psql "$DATABASE_URL" -tAc "select count(*) from pg_class c where c.relnamespace = 'public'::regnamespace and c.relkind = 'r' and c.relname <> 'schema_migrations' and not c.relrowsecurity")" = "0"
          test "$(psql "$DATABASE_URL" -tAc "select count(*) from pg_class c where c.relnamespace = 'public'::regnamespace and c.relkind = 'r' and c.relname <> 'schema_migrations' and (select count(*) from pg_policies p where p.schemaname = 'public' and p.tablename = c.relname and p.policyname in (c.relname || '_app_access', c.relname || '_deny_clients')) <> 2")" = "0"
          test "$(psql "$DATABASE_URL" -tAc "select count(*) from pg_attribute a join pg_class c on c.oid = a.attrelid where c.relnamespace = 'public'::regnamespace and c.relkind = 'r' and a.attnum > 0 and not a.attisdropped and a.attacl is not null")" = "0"
          test "$(psql "$DATABASE_URL" -tAc "select count(*) from pg_roles where rolname = 'leavetrack_app' and (rolsuper or rolbypassrls or rolcreatedb or rolcreaterole or rolreplication)")" = "0"
          test "$(psql "$DATABASE_URL" -tAc "select has_table_privilege('anon', 'public.users', 'SELECT')")" = "f"
          test "$(psql "$DATABASE_URL" -tAc "select has_table_privilege('authenticated', 'public.leave_requests', 'SELECT')")" = "f"
          test "$(psql "$DATABASE_URL" -tAc "select has_table_privilege('leavetrack_app', 'public.leave_requests', 'UPDATE')")" = "t"
          test "$(psql "$DATABASE_URL" -tAc "select has_table_privilege('leavetrack_app', 'public.leave_requests', 'DELETE')")" = "f"
      - name: Submit-request integration test
        run: npm run test:db
